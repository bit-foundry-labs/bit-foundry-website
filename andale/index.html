<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#fff8f2"/>
  <meta name="description" content="Practica español de México con oraciones naturales, expresiones cotidianas y explicaciones claras."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="¡Ándale!"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>

  <style>:root{
 --paper:#fff8f2;--canvas:#fffaf7;--blush:#f5e3dd;--rose:#b97d72;--rose-dark:#88564c;
 --coffee:#49362f;--ink:#4a3934;--muted:#917c74;--line:#e9d8ce;--sage:#858b68;
 --serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;
 font-family:var(--sans);color:var(--ink);background:var(--paper);font-synthesis:none
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}a{color:inherit}::selection{background:#e9c4b8;color:#513d35}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #997167;outline-offset:3px}
#app{min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}
.sidebar{border-right:1px solid #e9dcd3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:34px 21px 23px 27px;background:#fffaf6;z-index:5}
.wordmark{font-family:var(--serif);font-style:italic;font-size:40px;letter-spacing:-.065em;color:#885248;white-space:nowrap;line-height:1.1}
.brand-caption{font-size:9px;font-weight:700;letter-spacing:.24em;color:#ae8f82;margin:11px 0 0 3px}
.nav-label{font-size:10px;letter-spacing:.2em;font-weight:700;color:#b49c91;margin:60px 0 17px 12px}
.nav-items{display:flex;flex-direction:column;gap:5px}.nav-item{appearance:none;border:0;background:transparent;color:#806c64;text-align:left;padding:14px 15px;display:flex;align-items:center;gap:13px;border-radius:13px;font-size:13px;font-weight:600;transition:background .2s,color .2s}
.nav-item svg,.bottom-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:#f6ede7}.nav-item.active{background:#f3e4df;color:#915b52}
.review-count{margin-left:auto;background:#bb847a;color:white;border-radius:10px;font-size:10px;min-width:18px;text-align:center;padding:2px 5px}
.sidebar-bottom{margin-top:auto;padding:22px 12px 11px;border-top:1px solid var(--line)}.side-star{font-family:var(--serif);font-size:30px;color:#b88574}.side-note{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.2;margin:5px 0 8px}.side-small{font-size:11px;color:var(--muted);line-height:1.7}
.main{min-width:0}.topbar{height:92px;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(24px,5.7vw,94px);border-bottom:1px solid #eddcd2}
.topbar-left{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.18em;color:#a28a7f;font-weight:700}.topbar-left .sunmark{font-size:20px;color:#c18c7f;font-weight:400}.topbar-right{display:flex;align-items:center;gap:17px;font-size:12px;color:#866e64}
.streak-pill{display:flex;align-items:center;gap:8px;padding:10px 13px;border:1px solid #ecd6ca;background:#fffaf5;border-radius:28px}.streak-pill b{color:#9a6253}.mini-dot{height:7px;width:7px;background:#b98a77;border-radius:100%}
.content{padding:0 clamp(24px,5.7vw,94px) 105px;max-width:1600px;margin:0 auto}
.section-label{font-size:11px;letter-spacing:.20em;color:#a58173;font-weight:700}.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.03em}
.home-hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(350px,1.08fr);align-items:center;gap:48px;padding-top:66px;min-height:570px}
.hero-kicker{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.20em;color:#a58173;font-weight:700}.kicker-line{display:inline-block;width:32px;height:1px;background:#bf9386}
.hero-title{font-family:var(--serif);font-size:clamp(56px,5.6vw,92px);line-height:1.025;font-weight:400;letter-spacing:-.045em;margin:24px 0}.hero-title em{color:#b98075;font-weight:400}.hero-desc{color:#79675e;line-height:1.86;font-size:16px;max-width:425px;margin:0 0 31px}
.button-primary{display:inline-flex;align-items:center;justify-content:center;gap:15px;background:#b77c70;color:white;border:1px solid #b77c70;border-radius:100px;min-height:54px;padding:13px 26px;font-size:12px;font-weight:700;letter-spacing:.07em;transition:transform .18s,background .18s;box-shadow:0 9px 24px #bf887324}
.button-primary:hover:not(:disabled){background:#9e685e;transform:translateY(-2px)}.button-primary:disabled{background:#d6bab1;border-color:#d6bab1;box-shadow:none}
.button-soft{border:1px solid #e0c4b8;background:rgba(255,255,255,.5);color:#936b60;min-height:48px;padding:10px 19px;border-radius:999px;font-size:12px;font-weight:700}.button-soft:hover{background:#f9eee7}
.hero-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.hero-aside{display:flex;align-items:center;gap:9px;color:#a58f83;font-size:12px;margin-top:24px}

.architecture:after{position:absolute;content:' ';inset:0;border:1px solid rgba(133,78,62,.12);border-radius:inherit;pointer-events:none}.arch-caption{position:absolute;right:24px;bottom:20px;background:#fff9f4d8;color:#a17d6f;padding:9px 12px;border-radius:6px;font-size:10px;letter-spacing:.15em}
.rule{height:1px;background:var(--line);margin:53px 0 34px}.row-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.section-heading{font:normal 37px/1.15 var(--serif);letter-spacing:-.025em;margin:10px 0 4px}.description{color:#8c7870;line-height:1.8;font-size:13px}.text-button{background:none;border:0;border-bottom:1px solid #c8a89c;color:#a16b60;padding:3px 0 4px;font-size:12px;font-weight:700;white-space:nowrap}
.collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.collection-card{position:relative;text-align:left;min-height:245px;padding:25px 25px 22px;border:1px solid rgba(140,100,86,.12);border-radius:8px 75px 8px 8px;background:linear-gradient(138deg,#fffefa 5%,var(--card-color) 115%);transition:transform .2s,box-shadow .2s;overflow:hidden;display:flex;flex-direction:column}
.collection-card:hover{transform:translateY(-4px);box-shadow:0 17px 28px #ae8b7c17}.collection-card:after{content:'';position:absolute;right:-24px;top:36px;width:100px;height:180px;border:1px solid currentColor;opacity:.13;transform:rotate(24deg);border-radius:70px 70px 0 0}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.card-number{font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--card-ink)}.card-ornament{font-size:28px;color:var(--card-ink);font-family:var(--serif);font-weight:400}
.card-title{font:normal 32px/1.05 var(--serif);letter-spacing:-.015em;color:#4d3a33;max-width:180px;margin:auto 0 7px}.card-subtitle{font-size:12px;color:#947a70}.card-progress{font-size:11px;font-weight:700;margin-top:19px;color:var(--card-ink);display:flex;align-items:center;gap:10px}.card-progress-line{height:3px;flex:1;max-width:95px;background:#ffffff7d;border-radius:8px;overflow:hidden}.card-progress-line span{display:block;height:100%;background:var(--card-ink);opacity:.65}
.daily-strip{display:grid;grid-template-columns:1fr auto;align-items:center;gap:26px;padding:24px 27px;margin-top:38px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.daily-title{font:normal 26px/1.2 var(--serif)}.daily-caption{font-size:12px;color:var(--muted);margin-top:4px}.daily-meter{width:min(210px,25vw);height:5px;border-radius:10px;background:#e9d9cf;overflow:hidden}.daily-meter>div{height:100%;background:#8a916f;transition:width .2s}.daily-right{text-align:right;font-size:12px;font-weight:700;color:#778263}.daily-right div:last-child{margin-top:9px}
.page-heading{margin:65px 0 37px}.page-title{font:normal clamp(50px,5vw,74px)/1.07 var(--serif);margin:14px 0 13px;letter-spacing:-.035em}.page-sub{font-size:15px;color:#8f786d;max-width:550px;line-height:1.8}

 <div class="mode-control" role="group" aria-label="Modo de respuesta"><button data-action="mode" data-id="choose" class="${answerMode==='choose'?'selected':''}" ${answered?'disabled':''}>Elegir</button><button data-action="mode" data-id="write" class="${answerMode==='write'?'selected':''}" ${answered?'disabled':''}>Escribir</button></div>
 <button class="ghost-link" data-action="translation">${showTranslation?'Ocultar':'Mostrar'} traducción</button></div>
 ${answerMode==='choose'?`<div class="choices" role="group" aria-label="Respuestas posibles">${choices}</div>`:`<form class="type-area" id="answer-form"><input class="typed-input" id="typed-input" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Escribe la palabra que falta" placeholder="Escribe la palabra que falta…" value="${escapeHtml(typedValue)}" ${answered?'disabled':''}/><div class="accent-keys">${['á','é','í','ó','ú','ü','ñ'].map(k=>`<button type="button" data-action="accent" data-value="${k}" ${answered?'disabled':''}>${k}</button>`).join('')}</div></form>`}
 ${answered?`<div class="feedback ${answered.correct?'':'error'}" role="status" aria-live="polite"><div class="feedback-title">${answered.correct?'¡Así se dice!':'Casi. La respuesta es '+escapeHtml(q.answer)+'.'}</div><div class="feedback-note">${escapeHtml(q.explanation)}</div><div class="feedback-example">${escapeHtml(q.spoken)}</div></div>`:''}
 <div class="practice-bottom"><div class="practice-caption">${answered? 'Una frase menos que te sonará desconocida.':'No pasa nada si te equivocas.'}</div>
 ${answered?`<button class="button-primary" data-action="next">${session.index===session.queue.length-1?'Ver resultado':'Siguiente frase'} ${icon('arrow')}</button>`:answerMode==='write'?`<button class="button-primary" data-action="check">Comprobar ${icon('arrow')}</button>`:`<span class="practice-caption" aria-hidden="true">Elige una opción</span>`}</div>
 </div>`}
function completionView(){const total=session.queue.length,passed=session.correct;return `<div class="complete-panel"><div class="completion-mark">✳</div><div class="section-label">UN PASITO MÁS</div><h1>${session.review?'¡Buen repaso!':'¡Muy bien!'}</h1><p>Terminaste esta práctica. Lo importante no es hacerlo perfecto; es reconocer cada vez más expresiones cuando las escuchas.</p><div class="complete-stats"><div><strong>${passed} / ${total}</strong><span>Respuestas correctas</span></div><div><strong>${reviewQuestions().length}</strong><span>Por repasar</span></div></div><div class="complete-actions">${session.review?'':`<button class="button-primary" data-action="start" data-id="${session.collectionId}">Otra ronda ${icon('arrow')}</button>`}${reviewQuestions().length?`<button class="button-soft" data-action="start-review">Repasar errores</button>`:''}<button class="button-soft" data-action="navigate" data-id="collections">Elegir otra colección</button></div></div>`}
function reviewView(){const due=reviewQuestions();return `<section class="page-heading"><div class="section-label">SEGUNDAS OPORTUNIDADES</div><h1 class="page-title">Repasar es aprender.</h1><p class="page-sub">Aquí aparecen las frases que todavía cuestan un poquito. Cuando aciertas una, sale de tu lista de repaso.</p></section>
 ${due.length?`<div class="review-intro"><div><h2>${due.length} ${due.length===1?'frase':'frases'} para volver a ver.</h2><p>Una ronda corta, a tu ritmo y sin penalizaciones.</p></div><button class="button-primary" data-action="start-review">Empezar repaso ${icon('arrow')}</button></div><div class="review-list">${due.slice(0,12).map(q=>`<div class="review-row"><div><div class="review-phrase">${escapeHtml(q.spoken)}</div><div class="review-caption">${collections.find(c=>c.id===q.collectionId)?.title||''}</div></div><span class="section-label">PENDIENTE</span></div>`).join('')}</div>`:
 `<div class="review-empty"><div class="completion-mark">✳</div><h2>Todo al día.</h2><p>Las frases que respondes incorrectamente aparecerán aquí. Por ahora, puedes explorar otra colección.</p><button class="button-primary" data-action="navigate" data-id="collections">Explorar frases ${icon('arrow')}</button></div>`}`}
function statsView(){const x=overall();return `<section class="page-heading"><div class="section-label">TU CAMINO</div><h1 class="page-title">Cada palabra cuenta.</h1><p class="page-sub">Tu avance se guarda en este navegador. Sin cuenta, sin presión y sin compararte con nadie.</p></section>
 <div class="stats-grid"><div class="stat-card"><div class="stat-number">${x.learned}</div><div class="stat-label">Frases practicadas</div><div class="stat-details">De ${questions.length} disponibles</div></div><div class="stat-card"><div class="stat-number">${x.accuracy}%</div><div class="stat-label">Respuestas correctas</div><div class="stat-details">${x.correct} de ${x.attempts} intentos</div></div><div class="stat-card"><div class="stat-number">${streak()}</div><div class="stat-label">Días seguidos</div><div class="stat-details">Poquito a poquito</div></div></div>
 <section class="stat-section"><div class="section-label">POR COLECCIÓN</div><h2 class="section-heading">Tus recorridos.</h2><div class="stat-list">${collections.map(c=>{const st=collectionStats(c);return `<div class="stat-line"><div class="stat-line-name">${c.title}</div><div class="stat-line-track"><div style="width:${st.studied/st.total*100}%"></div></div><div class="stat-line-value">${st.studied}/${st.total}</div></div>`}).join('')}</div></section><div class="stats-note">Tu progreso es local al dispositivo y navegador que estés usando. Si borras los datos de este sitio, también se borra el avance guardado.</div>`}
function render(){const views={home:homeView,collections:collectionsView,practice:practiceView,review:reviewView,stats:statsView};app.innerHTML=shell((views[screen]||homeView)());document.title=`${screen==='practice'?'Practicar':screen==='collections'?'Colecciones':screen==='review'?'Repasar':screen==='stats'?'Mi avance':'Español de México'} · ¡Ándale!`}
function announce(msg){toast=msg;render(); /* toast cleared by next interaction */}
function navigate(to){if(!['home','collections','review','stats'].includes(to))return;screen=to;session=null;answered=null;toast='';render();window.scrollTo?.(0,0)}
function startSession(collectionId,isReview=false){const col=collections.find(c=>c.id===collectionId);let rows=isReview?reviewQuestions():questions.filter(q=>q.collectionId===col?.id);
 if(!rows.length){navigate(isReview?'review':'collections');return}
 if(!isReview){rows=rows.slice().sort((a,b)=>{
  const aa=recordFor(a.id),bb=recordFor(b.id);
  const priority=r=>r.attempts===0?0:r.needsReview?1:2;
  return priority(aa)-priority(bb)||aa.attempts-bb.attempts||a.id.localeCompare(b.id)
 })}
 const queue=rows.slice(0,SESSION_LENGTH).map(q=>q.id);
 session={collectionId:isReview?'entre-amigos':collectionId,review:isReview,queue,index:0,correct:0,choiceOrder:Object.fromEntries(queue.map(id=>[id,shuffled(byId[id].choices)]))};
 screen='practice';answerMode='choose';answered=null;showTranslation=true;typedValue='';toast='';render();window.scrollTo?.(0,0)
}
function normalize(s){return String(s).trim().toLocaleLowerCase('es-MX').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function submitAnswer(raw){if(answered||!session)return;const q=currentQuestion();if(!q)return;const correct=normalize(raw)===normalize(q.answer);answered={raw,correct};if(correct)session.correct++;
 const rec=recordFor(q.id);progress.records[q.id]={attempts:rec.attempts+1,correct:rec.correct+(correct?1:0),needsReview:!correct};
 progress.days[dateKey()]=(progress.days[dateKey()]||0)+1;save();toast='';render();
 const feedback=app.querySelector('.feedback');if(feedback)feedback.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){if(!session||!answered)return;session.index++;answered=null;typedValue='';showTranslation=true;toast='';render();window.scrollTo?.(0,0)}
function speak(){const q=currentQuestion();if(!q)return;if(!('speechSynthesis' in window)){announce('La voz no está disponible en este navegador.');return}
 window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.spoken);u.lang='es-MX';u.rate=0.86;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='es-mx')||voices.find(v=>v.lang.toLowerCase().startsWith('es'))||null;window.speechSynthesis.speak(u)
}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;
 if(action==='navigate')navigate(id);
 else if(action==='start')startSession(id);
 else if(action==='start-review')startSession(null,true);
 else if(action==='answer')submitAnswer(b.dataset.value);
 else if(action==='next')next();
 else if(action==='check'){const input=app.querySelector('#typed-input');submitAnswer(input?.value||'')}
 else if(action==='audio')speak();
 else if(action==='translation'){showTranslation=!showTranslation;render()}
 else if(action==='mode'){if(answered)return;answerMode=id;typedValue='';render();if(id==='write')app.querySelector('#typed-input')?.focus()}
 else if(action==='accent'){const input=app.querySelector('#typed-input');if(input){const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;input.value=input.value.slice(0,start)+b.dataset.value+input.value.slice(end);typedValue=input.value;input.focus();input.setSelectionRange(start+1,start+1)}}
});
app.addEventListener('input',e=>{if(e.target.id==='typed-input')typedValue=e.target.value});
app.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();submitAnswer(e.target.querySelector('input')?.value||'')}});
document.addEventListener('keydown',e=>{
 if(screen!=='practice'||answered||!session)return;
 if(e.target.matches('input,textarea,[contenteditable=true]'))return;
 if(answerMode==='choose'&&['1','2','3','4','a','b','c','d'].includes(e.key.toLowerCase())){
  const index='1234'.includes(e.key)?Number(e.key)-1:'abcd'.indexOf(e.key.toLowerCase());
  const c=currentQuestion()?.choices[index];if(c)submitAnswer(c)
 }
});
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor?.isNativePlatform?.()) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body>
</html>
