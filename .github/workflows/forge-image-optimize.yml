name: One-time foundry asset optimization

on:
  push:
    branches:
      - design/forge-hero
    paths:
      - assets/forge-hall-upscaled.png
      - scripts/optimize-forge-image.py
      - .github/workflows/forge-image-optimize.yml

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-forge-image.py
      - name: Commit optimized images to design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/forge-hall-desktop.webp assets/forge-hall-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize upscaled foundry artwork for desktop and mobile"
            git push origin HEAD:design/forge-hero
          fi
